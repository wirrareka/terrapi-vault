# cargo-deny — supply-chain gate for the root at-rest library workspace.
# CI runs `cargo deny check` here and in services/ (which has its own deny.toml —
# the two dependency trees are deliberately separate; see services/Cargo.toml).

[advisories]
yanked = "deny"

# License policy: allow the permissive set this tree actually uses (the crate itself is
# MIT OR Apache-2.0). A dependency under a license not listed here fails the gate —
# surfacing a copyleft/unknown license before it ships rather than after.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8

# Dependency hygiene: flag duplicate versions of the same crate (bloat / drift) as a
# warning, and refuse wildcard version requirements in first-party manifests.
[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

# Source policy: only crates.io. An unknown registry or a git dependency fails the gate
# (supply chain — no pulling code from an unpinned/unexpected source).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
