# Separate workspace for the proximi.io platform / personal-sync SERVICES.
# Deliberately NOT rooted at the repo top: the root `terrapi-vault` lib crate keeps
# its 1.83 MSRV floor (`../rust-toolchain.toml`) and stays dependency-neutral so
# memento/probe are never constrained (see ../docs/planning/01-vault-as-service.md §2.1).
# Services consume the lib as a plain path dependency, NOT as a workspace member.
[workspace]
resolver = "2"
members = ["vault-transport", "vault-broker", "vault-sync", "vault-console"]

[workspace.package]
version = "0.1.11"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/terrapi/terrapi-vault"

[workspace.dependencies]
# The at-rest crypto library — reused, never re-implemented. Path dep, not a member.
terrapi-vault = { path = ".." }
vault-transport = { path = "vault-transport" }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = { version = "1.0.133", features = ["raw_value"] }
thiserror = "1.0.69"
# Tamper-evident audit hash chain (SHA-256 over prev-hash ++ seq ++ event bytes).
sha2 = "0.10"
# HMAC-SHA256 for AWS SigV4 presigned-URL signing (object-store presign op). RustCrypto,
# pairs with sha2 0.10.
hmac = "0.12"
# KMS DEK wrap/unwrap (envelope encryption of aether fleet-backup keys): XChaCha20-Poly1305.
# A 192-bit (24-byte) random nonce is collision-safe at any realistic wrap volume, so a
# long-lived KEK needs no wrap counter (unlike AES-GCM's 96-bit nonce). See kms.rs / review S6.
chacha20poly1305 = "0.10"
base64 = "0.22"
# Master-key handling for the broker unseal: the same zeroizing secret wrapper the lib
# pins, so the SecretBox<DerivedKey> returned by terrapi-vault::derive_key is one type.
secrecy = "0.10.3"
# Service runtime (Svet A / broker; the neutral lib never sees these).
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
time = { version = "0.3.36", features = ["formatting", "macros"] }
# mTLS-over-WireGuard termination (daemon auth): rustls with required client-cert
# verification vs the fleet Root CA, peer-cert SAN -> role. Manual accept loop over
# hyper-util so the verified SAN reaches the Principal extractor.
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
x509-parser = "0.16"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower = { version = "0.5", features = ["util"] }
# X.509 issuance: dev/unit certs for the mTLS path AND the enterprise-PKI leaf-issuance
# engine (`pki.rs`). The `x509-parser` feature enables `from_ca_cert_pem` (load the
# operator-delivered intermediate to sign leaves under).
rcgen = { version = "0.13", features = ["x509-parser"] }
# SSH signed-certificate CA (Phase 2): ed25519 CA key + OpenSSH certificate signing.
ssh-key = { version = "0.6", features = ["ed25519", "std"] }
rand = "0.8"
# vault-sync device auth (Svet B): raw ed25519 verification of per-request device signatures.
ed25519-dalek = "2"
# Dynamic-cred engines (Phase 3): async trait for backend adapters + the OpenSearch
# security REST client (rustls TLS, no OpenSSL).
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# KMS-cap JWT verification (Option J, secrets-broker.md §KMS root-of-trust): verify
# identity-minted short-TTL ES256 workload creds against the issuer's JWKS. See vault-broker/src/jwt.rs.
jsonwebtoken = "9"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prose lint: fires on domain terms (OpenSearch, RethinkDB, WireGuard, SQLCipher…) in
# doc comments — backticking them reads worse. Matches the lib crate's stance.
doc_markdown = "allow"
