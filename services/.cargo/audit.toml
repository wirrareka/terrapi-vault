# cargo-audit config for the services workspace. cargo-audit scans the raw Cargo.lock (not the
# build graph), so it reports advisories on crates that are present in the lock but never compiled.
# Run: `cargo audit`. See docs/review/round4/dependencies.md for the full rationale.
[advisories]
ignore = [
  # RUSTSEC-2023-0071 — rsa "Marvin Attack" timing side-channel (MEDIUM). `rsa` is a TEST-ONLY
  # dev-dependency of vault-console: the OIDC unit tests generate a throwaway RSA-2048 keypair to
  # exercise the RS256 `private_key_jwt` client-assertion path (oidc.rs test module), so no private
  # key is committed to this secrets-boundary repo. `cargo tree -i rsa --edges no-dev` is empty —
  # `rsa` is NEVER compiled into a shipped binary. The Marvin Attack is a timing side-channel in RSA
  # PKCS#1 v1.5 *decryption*; the tests only generate + PKCS#8-encode a key (jsonwebtoken signs),
  # never decrypt, so the side-channel is unreachable even in the test process. Mirrors deny.toml.
  # Revisit if `rsa` ever enters the non-dev graph.
  "RUSTSEC-2023-0071",
]
