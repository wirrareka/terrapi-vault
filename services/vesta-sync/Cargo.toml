[package]
name = "vesta-sync"
description = "Svet B: personal multi-device vault sync for memento/probe — E2E (server-blind), device-keypair auth, row-level oplog (HLC + LWW). Carries NONE of the platform (no OpenSearch/RethinkDB/tenants/residency). See ../../docs/planning/02-vesta-sync-oplog.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vesta-sync"
path = "src/main.rs"

[dependencies]
# At-rest lib: reused for its `rusqlite` re-export (one SQLCipher-enabled sqlite in the tree).
# Op CONTENT is already E2E-encrypted, so the DB is plain by default; set VAULT_SYNC_DB_KEY[_FILE]
# to additionally SQLCipher-encrypt the DB+WAL at rest (protects metadata — see store.rs apply_key).
terrapi-vesta.workspace = true
# Shared `Hlc` ordering primitive (also used by the broker lease tree).
vesta-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync` adds the per-vault broadcast channel that fans pushed ops out to WS tail subscribers;
# `time` backs the per-request timeout (harden::timeout).
tokio = { workspace = true, features = ["sync", "time"] }
# `ws` adds the live-tail WebSocket endpoint.
axum = { workspace = true, features = ["ws"] }
time.workspace = true
base64.workspace = true
# Device-signature verification (raw ed25519) + content hashing for the canonical sig string
# and the enrolment verifier (SHA-256 of the client-side Argon2 enrolment secret).
ed25519-dalek.workspace = true
sha2.workspace = true

[dev-dependencies]
# Test-only: generate device keypairs + sign canonical strings to exercise the auth path.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
tower.workspace = true
# Test-only: a real WebSocket client for the end-to-end /tail live-tail test.
tokio-tungstenite = "0.29"
futures-util = "0.3"

[lints]
workspace = true
