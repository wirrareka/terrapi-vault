[package]
name = "vault-sync"
description = "Svet B: personal multi-device vault sync for memento/probe — E2E (server-blind), device-keypair auth, row-level oplog (HLC + LWW). Carries NONE of the platform (no OpenSearch/RethinkDB/tenants/residency). See ../../docs/planning/02-vault-sync-oplog.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vault-sync"
path = "src/main.rs"

[dependencies]
# At-rest lib: reused for its `rusqlite` re-export (one sqlite in the tree). The server DB
# holds only opaque, already-E2E-encrypted ops, so it is plain sqlite (no PRAGMA key).
terrapi-vault.workspace = true
# Shared `Hlc` ordering primitive (also used by the broker lease tree).
vault-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync` adds the per-vault broadcast channel that fans pushed ops out to WS tail subscribers.
tokio = { workspace = true, features = ["sync"] }
# `ws` adds the live-tail WebSocket endpoint.
axum = { workspace = true, features = ["ws"] }
time.workspace = true
base64.workspace = true
# Device-signature verification (raw ed25519) + content hashing for the canonical sig string
# and the enrolment verifier (SHA-256 of the client-side Argon2 enrolment secret).
ed25519-dalek.workspace = true
sha2.workspace = true

[dev-dependencies]
# Test-only: generate device keypairs + sign canonical strings to exercise the auth path.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true
tower.workspace = true

[lints]
workspace = true
