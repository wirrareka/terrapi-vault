[package]
name = "vesta-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vesta-console"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
# Shared transport/types crate — provides the vault→vesta env-compat shim (apply_vault_env_compat).
vesta-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Outbound mTLS client to the group's brokers (presents the console's fleet-CA client cert).
reqwest.workspace = true
# OIDC RP (P1b): sign the `private_key_jwt` client assertion (RS256, the cert's kid) + verify the
# id_token against identity's JWKS. Same crate the broker uses for KMS-cap tokens (jwt.rs).
jsonwebtoken.workspace = true
# PKCE challenge (S256) + base64url for code-verifier / state / nonce / jti.
sha2.workspace = true
base64.workspace = true
# CSPRNG for the code-verifier, state, nonce, jti, and session ids.
rand.workspace = true
# SPA embed (single binary). OPTIONAL + behind the `embed-ui` feature so the default build (CI)
# needs no built `web/dist`; the release builds the web app first then `--features embed-ui`.
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

[features]
# Compile `web/dist/` into the binary (release). Off by default → CI compiles without the SPA.
embed-ui = ["dep:rust-embed"]

[dev-dependencies]
# Tests only: generate throwaway keypairs at runtime (RS256 for the client-assertion path, ES256
# for the id_token path — identity signs id_tokens ES256) — so no private key is committed to this
# secrets-boundary repo. rcgen generates the EC (P-256) key; rsa generates the RSA key.
rsa = { version = "0.9", features = ["pem"] }
rcgen.workspace = true
base64.workspace = true
rand.workspace = true

[lints]
workspace = true
