[package]
name = "terrapi-vesta"
version = "0.1.0"
edition = "2021"
# The deliberate MSRV floor (matches rust-toolchain.toml + the services workspace); the lib is
# only tested on 1.83, so this is the verified minimum — do not claim a lower, untested version.
rust-version = "1.83"
description = "Terrapi shared encrypted-at-rest SQLCipher vault: Argon2id KDF, key rotation, documented on-disk format. Adopted by memento (notes) and probe (API client); vault files are binary-compatible across apps."
license = "MIT OR Apache-2.0"
repository = "https://github.com/terrapi/terrapi-vesta"
homepage = "https://github.com/terrapi/terrapi-vesta"
documentation = "https://docs.rs/terrapi-vesta"
readme = "README.md"
keywords = ["sqlcipher", "encryption", "argon2", "vault", "sqlite"]
categories = ["cryptography", "database"]

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher"] }
argon2 = "0.5.3"
rand = "0.8.5"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
secrecy = "0.10.3"
thiserror = "2.0.18"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
# AEAD used to wrap the random data-encryption key (DEK) under each credential
# slot (password / recovery) in the v2 vault format. Same version the memento
# sync layer already vendors, so no new audited cipher enters the workspace.
chacha20poly1305 = "0.10.1"

[features]
# `note-export` (the `.memento-note` single-note container) is on by default so memento is
# unaffected; a neutral consumer (e.g. probe) can drop it with `default-features = false`.
default = ["note-export"]
note-export = []

[dev-dependencies]
tempfile = "3.14.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Intentional public API naming (Vault*, Kdf*, VaultMeta) — the repetition
# is the documented surface the downstream crate is built against.
module_name_repetitions = "allow"
# Prose lint: fires on domain terms like SQLCipher / WAL / SQLite that are
# not code items; backticking them would read worse in rustdoc.
doc_markdown = "allow"
# Distinct, intentional names (m/t/p cost, salt vars in tests).
many_single_char_names = "allow"
similar_names = "allow"
