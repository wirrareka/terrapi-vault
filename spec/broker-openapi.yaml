  /v1/{group}/{tenant_id}/kms/{key_id}/rewrap:
    post:
      tags: [kms]
      operationId: kmsRewrap
      summary: Server-side re-wrap a blob onto the target's current KEK version.
      description: |
        Unwraps the supplied blob under its own (embedded) KEK version and re-wraps the
        recovered DEK under the target's **current** version — the plaintext DEK never leaves
        the broker. Drives the ack-gated re-wrap flow (secrets-broker.md §KMS root-of-trust):
        after a `rotate`, a consumer streams its ~150 wrapped blobs through `rewrap`, then
        emits `kms.rewrap_complete` so identity can retire the old root. cap `kms`.
      x-implementation-status: implemented
      x-audit-action: kms.rewrap
      security:
        - { mtlsWireGuard: [], kmsBearer: [] }   # Option J (VAULT_KMS_JWT_ISSUER set): mTLS + identity JWT
        - { mtlsWireGuard: [] }                   # cap mode: mTLS + cert-SAN `kms` capability (aether)
      parameters:
        - { $ref: "#/components/parameters/GroupParam" }
        - { $ref: "#/components/parameters/TenantIdParam" }
        - { name: key_id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }, description: backup target id }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KmsRewrapRequest" } } } }
      responses:
        "200": { description: re-wrapped blob (under the current KEK version), content: { application/json: { schema: { $ref: "#/components/schemas/KmsWrapResponse" } } } }
        "400": { description: bad input, or blob did not authenticate (wrong target / tampered), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/GroupMismatch" }
        "503": { $ref: "#/components/responses/Sealed" }

