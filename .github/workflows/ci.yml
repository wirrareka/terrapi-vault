name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The at-rest library: must keep building + testing on its 1.83 MSRV floor.
  lib-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Rust 1.83 (the lib MSRV floor)
        # SHA-pinned (supply-chain). The exact toolchain comes from rust-toolchain.toml (root pins
        # 1.83), which dtolnay/rust-toolchain reads when invoked by SHA — no `toolchain:` input.
        uses: dtolnay/rust-toolchain@bd41891a8e7f4b8649f6d684415e1a6155fe4e22 # 1.83.0
        with:
          components: rustfmt, clippy
      - run: cargo +1.83.0 fmt --check
      - run: cargo +1.83.0 clippy --all-targets -- -D warnings
      - run: cargo +1.83.0 build
      - run: cargo +1.83.0 test

  # Dependency firewall: the lib must stay platform-neutral so memento/probe are never
  # constrained (see docs/planning/01-vault-as-service.md §2.1). Fail if any networking /
  # platform crate leaks into the lib's dependency tree.
  lib-neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@bd41891a8e7f4b8649f6d684415e1a6155fe4e22 # 1.83.0
      - name: Assert no platform/networking deps in the lib tree
        run: |
          tree="$(cargo +1.83.0 tree -e normal --prefix none | sort -u)"
          forbidden='tokio|axum|hyper|reqwest|rustls|tower-http|opensearch|reql|rethinkdb'
          if echo "$tree" | grep -Eiq "^($forbidden) "; then
            echo "::error::Platform/networking crate leaked into the neutral lib:"
            echo "$tree" | grep -Ei "^($forbidden) "
            exit 1
          fi
          echo "lib dependency tree is neutral ✓"

  # The services workspace (vesta-broker / vesta-sync / vesta-transport): its own
  # toolchain (1.91.1), separate from the lib. Lives under services/.
  services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Rust 1.91.1 (services build toolchain)
        # SHA-pinned; the toolchain comes from services/rust-toolchain.toml (1.91.1).
        uses: dtolnay/rust-toolchain@ba6e37b9b9af502effa9a8e8d218bc68ac8ea564 # 1.91.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  # Supply-chain gate: RUSTSEC advisories, license allowlist, source pinning — for both
  # workspaces (each has its own deny.toml; see the comment there).
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: cargo deny (root lib)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
      - name: cargo deny (services)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
          manifest-path: services/Cargo.toml

  # The console SPA: lint + typecheck + unit tests. Release only runs `pnpm build`, so
  # without this job web regressions surface at release time instead of on push.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install (pnpm pinned via web/package.json packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
          pnpm --dir web install
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test

  # Cross-repo regression note: memento and probe consume the lib via
  # `path = "../terrapi-vault"`. Because Phase 0 left the root lib package byte-for-byte
  # unchanged, their build cannot regress from this repo. Their own CI builds the full
  # tree on 1.91.1; we do not vendor them here.
